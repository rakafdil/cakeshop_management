services:
  db:
    image: postgres:18-alpine
    container_name: cakeshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cakeshop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cakeshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
